name: Daily Motivation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show environment
        run: |
          echo "Python:"
          python --version

          echo "Pillow:"
          python -m pip --version

          echo "Repository files:"
          ls -la

          echo "App files:"
          ls -la app

          echo "Data files:"
          ls -la data

          echo "Output directory:"
          ls -la output || true

      - name: Install dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core

            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt

      - name: Verify fonts
        run: |
            echo "Checking DejaVu fonts..."

            ls -lh /usr/share/fonts/truetype/dejavu/

            test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
            test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

            echo "Fonts found successfully!"

      - name: Test Pillow
        run: |
          python -c "from PIL import Image, ImageDraw, ImageFont; print('Pillow works!')"

      - name: Check font files
        run: |
                echo "Current directory:"
                pwd

                echo "Font directory:"
                ls -lah fonts

                echo "File information:"
                file fonts/DejaVuSans.ttf
                file fonts/DejaVuSans-Bold.ttf

                echo "Font sizes:"
                wc -c fonts/DejaVuSans.ttf
                wc -c fonts/DejaVuSans-Bold.ttf

      - name: Generate poster
        run: |
          python app/main.py

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lah output

          echo "History:"
          cat data/history.json

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json

          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "Update quote history"
            git push
          fi

      - name: Upload poster
        uses: actions/upload-artifact@v4
        with:
          name: daily-motivation-poster
          path: output/*.png